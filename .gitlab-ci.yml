stages:
  - validate
  - test
  - package
  - security
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

variables:
  NODE_ENV: "test"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

default:
  interruptible: true

validate:
  stage: validate
  image: node:22-alpine
  before_script:
    - npm config set cache .npm --global
  script:
    - node --check app.js
    - node --check app.test.js
    - npm ci --ignore-scripts
    - npm audit --omit=dev --audit-level=high
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

unit_tests:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - mkdir -p test-results
    - node --test --test-reporter=junit --test-reporter-destination=test-results/junit.xml
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: test-results/junit.xml
  allow_failure: false

semgrep_sast:
  stage: security
  image:
    name: semgrep/semgrep:1.100.0
    entrypoint: [""]
  script:
    - semgrep scan --config p/nodejs --error --json --output semgrep-report.json .
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - semgrep-report.json
  allow_failure: false

secret_detection:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.24.2
    entrypoint: [""]
  script:
    - gitleaks detect --source . --no-git --redact --exit-code 1
  allow_failure: false

build_and_publish:
  stage: package
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull --tag "$IMAGE_TAG" --tag "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

container_scan:
  stage: security
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  needs:
    - job: build_and_publish
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image --no-progress --format cyclonedx --output gl-sbom.cdx.json "$IMAGE_TAG"
    - trivy image --no-progress --exit-code 1 --severity HIGH,CRITICAL "$IMAGE_TAG"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - gl-sbom.cdx.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH'

deploy_to_aws:
  stage: deploy
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2376"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  before_script:
    - apk add --no-cache aws-cli jq
    - test -n "$AWS_DEPLOY_ROLE_ARN" && test -n "$AWS_REGION" && test -n "$ECR_REPOSITORY" && test -n "$ECS_CLUSTER" && test -n "$ECS_SERVICE" && test -n "$ECS_TASK_FAMILY" && test -n "$ECS_CONTAINER_NAME" && test -n "$ECS_DESIRED_COUNT"
    - case "$ECS_DESIRED_COUNT" in ''|*[!0-9]*) echo "ECS_DESIRED_COUNT must be a non-negative integer"; exit 1 ;; esac
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - umask 077
    - printf '%s' "$GITLAB_OIDC_TOKEN" > /tmp/gitlab-oidc-token
    - export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/gitlab-oidc-token
    - export AWS_ROLE_ARN="$AWS_DEPLOY_ROLE_ARN"
    - export AWS_ROLE_SESSION_NAME="gitlab-$CI_PROJECT_ID-$CI_PIPELINE_ID"
    - export AWS_DEFAULT_REGION="$AWS_REGION"
    - aws sts get-caller-identity
  script:
    - docker pull "$IMAGE_TAG"
    - export ECR_REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    - docker tag "$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHA"
    - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHA"
    - export DEPLOY_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHA"
    - aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" --query taskDefinition --output json > task-definition-current.json
    - jq --arg image "$DEPLOY_IMAGE" --arg container "$ECS_CONTAINER_NAME" '.containerDefinitions |= map(if .name == $container then .image = $image else . end) | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' task-definition-current.json > task-definition-register.json
    - aws ecs register-task-definition --cli-input-json file://task-definition-register.json > task-definition-registered.json
    - export TASK_DEFINITION_ARN="$(jq -r '.taskDefinition.taskDefinitionArn' task-definition-registered.json)"
    - aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$TASK_DEFINITION_ARN" --desired-count "$ECS_DESIRED_COUNT" > /dev/null
    - aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
    - echo "Deployment completed with task definition $TASK_DEFINITION_ARN"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AWS_DEPLOY_ROLE_ARN'
      when: manual
    - when: never
  allow_failure: true
